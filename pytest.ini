[pytest]
testpaths = tests
python_files  = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -v
    --tb=short
    --no-header
    -rN
    --log-cli-level=WARNING

# Custom marks used in this suite
markers =
    auth:        Authentication and authorization tests
    integrity:   Data integrity and cleanup tests
    validation:  Input validation tests
    async_flow:  Asynchronous caption processing tests
    bonus:       Bonus edge case tests
